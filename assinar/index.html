<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contratar — Mimba</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--terra:#1C1008;--ouro:#B8860B;--ouro-x:#E8C547;--campo:#2D5A3D;--campo-l:#3D7A54;--creme:#F5EFE0;--border:#DDD5C8;--text:#1C1008;--text2:#5C4F42}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--terra);color:var(--creme);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
  .brand{font-family:'Playfair Display',serif;font-weight:900;color:var(--ouro-x);font-size:2rem}
  .sub{color:rgba(245,239,224,.6);font-size:.9rem;margin-bottom:2rem}
  .card{background:#fff;color:var(--text);border-radius:16px;padding:2rem;width:100%;max-width:520px}
  h2{font-family:'Playfair Display',serif;font-weight:700;font-size:1.4rem;margin-bottom:1.2rem;color:var(--terra)}
  .planos{display:grid;gap:.6rem;margin-bottom:1.4rem}
  .plano{border:1.5px solid var(--border);border-radius:10px;padding:.9rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s}
  .plano:hover{border-color:var(--campo-l)}
  .plano.sel{border-color:var(--campo);background:#EBF5EF}
  .plano-nome{font-weight:600}
  .plano-desc{font-size:12px;color:var(--text2)}
  .plano-preco{font-family:'Playfair Display',serif;font-weight:700;color:var(--campo)}
  .field{margin-bottom:.9rem}
  label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text)}
  input:focus{outline:none;border-color:var(--campo-l)}
  .opt{color:var(--text2);font-weight:400;text-transform:none;letter-spacing:0}
  .btn{width:100%;padding:13px;background:var(--campo);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:.6rem;font-family:inherit}
  .btn:disabled{opacity:.6;cursor:default}
  .erro{background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:1rem;display:none}
  .foot{color:rgba(245,239,224,.4);font-size:12px;margin-top:1.5rem;text-align:center;max-width:420px}
</style>
</head>
<body>
  <div class="brand">Mimba</div>
  <div class="sub">Gestão Crioulos · contrate sua cabanha</div>
  <div class="card">
    <h2>Contratar o Mimba</h2>
    <div class="field"><label>Plano</label><div class="planos" id="planos">Carregando planos…</div></div>
    <div class="field"><label>Nome da cabanha</label><input type="text" id="nome_cabanha" placeholder="Ex: Cabanha Santa Fé"></div>
    <div class="field"><label>Seu nome (responsável)</label><input type="text" id="responsavel" placeholder="Nome do dono/admin"></div>
    <div class="field"><label>Email de acesso</label><input type="email" id="email_admin" placeholder="seu@email.com"></div>
    <div class="field"><label>Telefone</label><input type="text" id="telefone" placeholder="(00) 00000-0000"></div>
    <div class="field"><label>CPF / CNPJ</label><input type="text" id="cpf_cnpj" placeholder="Só números"></div>
    <div class="field"><label>Código ABCCC <span class="opt">(opcional)</span></label><input type="text" id="abccc_codigo" placeholder="Registro da cabanha na ABCCC"></div>
    <button class="btn" id="btn" onclick="contratar()">Ir para o pagamento →</button>
    <div class="erro" id="erro"></div>
  </div>
  <div class="foot">Pagamento processado com segurança pelo Asaas (PIX, boleto ou cartão). O acesso é enviado por email assim que o pagamento é confirmado.</div>
<script>
const SUPA_URL='https://fmjfvfufkqswweyasjyp.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtamZ2ZnVma3Fzd3dleWFzanlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTA1NzAsImV4cCI6MjA5MDQ2NjU3MH0.wKwB51Ug80T8cYML9Dh8GcbXc5pRxMQKrdK7Y49f7AU';
let planoSel=null;

async function carregarPlanos(){
  const box=document.getElementById('planos');
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/planos?select=id,nome,preco_mensal,max_animais&ativo=eq.true&order=preco_mensal',{headers:{apikey:ANON,Authorization:'Bearer '+ANON}});
    const planos=await r.json();
    if(!Array.isArray(planos)||!planos.length){box.textContent='Não foi possível carregar os planos.';return;}
    box.innerHTML='';
    planos.forEach((p,i)=>{
      const lim=p.max_animais<0?'ilimitado':('até '+p.max_animais+' animais');
      const el=document.createElement('label');
      el.className='plano'+(i===0?' sel':'');
      el.innerHTML='<span><div class="plano-nome">'+p.nome+'</div><div class="plano-desc">'+lim+'</div></span><span class="plano-preco">R$ '+Number(p.preco_mensal).toFixed(0)+'/mês</span>';
      el.onclick=function(){document.querySelectorAll('.plano').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');planoSel=p.id;};
      box.appendChild(el);
      if(i===0)planoSel=p.id;
    });
  }catch(e){box.textContent='Não foi possível carregar os planos.';}
}
carregarPlanos();

async function contratar(){
  const err=document.getElementById('erro');err.style.display='none';
  const get=id=>document.getElementById(id).value.trim();
  const payload={plano_id:planoSel,nome_cabanha:get('nome_cabanha'),responsavel:get('responsavel'),email_admin:get('email_admin'),telefone:get('telefone'),cpf_cnpj:get('cpf_cnpj'),abccc_codigo:get('abccc_codigo')};
  if(!payload.plano_id||!payload.nome_cabanha||!payload.email_admin||!payload.cpf_cnpj){err.textContent='Preencha plano, nome da cabanha, email e CPF/CNPJ.';err.style.display='block';return;}
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Processando…';
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/criar-checkout',{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok||!j.invoiceUrl){err.textContent=j.erro||'Não foi possível iniciar o pagamento. Tente novamente.';err.style.display='block';btn.disabled=false;btn.textContent='Ir para o pagamento →';return;}
    window.location.href=j.invoiceUrl;
  }catch(e){err.textContent='Falha de conexão. Tente novamente.';err.style.display='block';btn.disabled=false;btn.textContent='Ir para o pagamento →';}
}
</script>
</body>
</html>
