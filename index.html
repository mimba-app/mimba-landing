document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4,134,11,.035) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse 55% 55% at 85% 20%,rgba(184,134,11,.14) 0%,transparent 65%),radial-gradient(ellipse 40% 50% at 5% 85%,rgba(45,90,61,.16) 0%,transparent 60%)\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1360px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:2.5rem;align-items:center\">\n    <div style=\"flex:1 1 520px;min-width:0\">\n      <div style=\"display:inline-flex;align-items:center;gap:.8rem;margin-bottom:2rem;padding:.45rem 1rem .45rem .6rem;background:rgba(184,134,11,.08);border:1px solid rgba(184,134,11,.18);border-radius:99px\">\n        <span style=\"background:#B8860B;color:#1C1008;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px\">Guarani<\u002Fspan>\n        <span style=\"font-size:12px;color:rgba(232,197,71,.65);font-weight:300\"><strong style=\"color:rgba(232,197,71,.9);font-weight:600\">Mimba<\u002Fstrong> · mymba · o animal sob cuidado, o ser que se cria<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'Playfair Display',serif;font-size:clamp(4.5rem,10vw,9rem);font-weight:900;line-height:.95;color:#F5EFE0;letter-spacing:-.04em;margin-bottom:1.4rem\">\n        Mimba<em style=\"color:#E8C547;font-style:normal\">.<\u002Fem>\n      <\u002Fdiv>\n      <p style=\"font-family:'Playfair Display',serif;font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:400;font-style:italic;color:rgba(245,239,224,.7);line-height:1.35;margin:0 0 1.4rem;max-width:560px\">A inteligência da sua cabanha.<\u002Fp>\n      <p style=\"font-size:1rem;color:rgba(245,239,224,.45);font-weight:300;max-width:540px;line-height:1.75;margin:0 0 2.6rem\">O histórico de cada animal, a genealogia da sua manada até a 5ª geração e o controle completo do dia a dia — em um sistema feito por quem cria crioulo, para quem cria crioulo.<\u002Fp>\n      <div style=\"display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:3.5rem\">\n        <a href=\"#planos\" style=\"display:inline-flex;align-items:center;gap:.5rem;background:#B8860B;color:#1C1008;font-size:15px;font-weight:700;padding:.9rem 2rem;border-radius:10px;text-decoration:none;box-shadow:0 4px 20px rgba(184,134,11,.3);transition:all .2s\" style-hover=\"background:#D4A017;transform:translateY(-2px)\">Contratar agora →<\u002Fa>\n        <a href=\"#modulos\" style=\"display:inline-flex;align-items:center;gap:.5rem;background:transparent;color:rgba(245,239,224,.65);border:1px solid rgba(255,255,255,.14);font-size:15px;font-weight:400;padding:.9rem 2rem;border-radius:10px;text-decoration:none;transition:all .2s\" style-hover=\"border-color:rgba(255,255,255,.3);color:#F5EFE0\">Ver funcionalidades<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:2.5rem;flex-wrap:wrap;padding-top:2.2rem;border-top:1px solid rgba(255,255,255,.07)\">\n        <div><div style=\"font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#F5EFE0;line-height:1;margin-bottom:.25rem\"><em style=\"color:#E8C547;font-style:normal\">ABCCC<\u002Fem><\u002Fdiv><div style=\"font-size:10px;color:rgba(245,239,224,.35);text-transform:uppercase;letter-spacing:.12em\">Integrado nativamente<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#F5EFE0;line-height:1;margin-bottom:.25rem\">5ª <em style=\"color:#E8C547;font-style:normal\">ger.<\u002Fem><\u002Fdiv><div style=\"font-size:10px;color:rgba(245,239,224,.35);text-transform:uppercase;letter-spacing:.12em\">Genealogia automática<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#F5EFE0;line-height:1;margin-bottom:.25rem\">11<\u002Fdiv><div style=\"font-size:10px;color:rgba(245,239,224,.35);text-transform:uppercase;letter-spacing:.12em\">Módulos completos<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#F5EFE0;line-height:1;margin-bottom:.25rem\">&lt;2<em style=\"color:#E8C547;font-style:normal\">min<\u002Fem><\u002Fdiv><div style=\"font-size:10px;color:rgba(245,239,224,.35);text-transform:uppercase;letter-spacing:.12em\">Sua cabanha no ar<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 380px;min-width:280px;max-width:520px;position:relative;height:min(640px,70vh);border-radius:20px;overflow:hidden\">\n      <image-slot id=\"hero-horse\" shape=\"rounded\" radius=\"20\" placeholder=\"Foto de impacto: cavalo crioulo de cabanha, close ou corpo inteiro\"><\u002Fimage-slot>\n      <div style=\"position:absolute;inset:0;background:linear-gradient(115deg,rgba(28,16,8,.55) 0%,rgba(28,16,8,0) 35%,rgba(28,16,8,0) 70%,rgba(28,16,8,.35) 100%);pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:absolute;left:-1px;top:0;bottom:0;width:70px;background:linear-gradient(90deg,#1C1008,transparent);pointer-events:none\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:linear-gradient(90deg,transparent,#DDD5C8,transparent)\"><\u002Fdiv>\n\n<!-- PILARES -->\n<section style=\"padding:7rem 5%\" id=\"pilares\">\n<div style=\"max-width:1200px;margin:0 auto\">\n  <div style=\"font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#B8860B;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem\"><span style=\"display:block;width:14px;height:2px;background:#B8860B;border-radius:2px\"><\u002Fspan>Por que o Mimba<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:3rem;align-items:flex-start;margin-bottom:2rem\">\n    <div style=\"flex:1 1 480px\">\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700;line-height:1.12;color:#1C1008;margin:0 0 .8rem\">Tradição não é o passado.<br>É o que você constrói para durar.<\u002Fh2>\n      <p style=\"font-size:1rem;color:#8A7F72;max-width:560px;font-weight:300;line-height:1.75;margin:0\">O criador crioulo acumula décadas de conhecimento sobre linhagem, saúde e reprodução dos animais. O Mimba existe para que esse conhecimento não fique só na cabeça do cabanheiro — e para que cada decisão seja tomada com dados reais.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0 1 320px;min-width:220px;height:220px;border-radius:16px;overflow:hidden\">\n      <image-slot id=\"pilares-photo\" shape=\"rounded\" radius=\"16\" placeholder=\"Cabanha crioula / campo ao amanhecer\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-top:3rem\">\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:16px;padding:2rem;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;animation:fadeUp .6s ease both\" style-hover=\"transform:translateY(-3px);border-color:#3D7A54\">\n      <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#2D5A3D,#52A870)\"><\u002Fdiv>\n      <div style=\"font-size:2rem;margin-bottom:1rem\">🧬<\u002Fdiv>\n      <h3 style=\"font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:#1C1008;margin:0 0 .6rem\">Inteligência da manada<\u002Fh3>\n      <p style=\"font-size:13.5px;color:#5C4F42;font-weight:300;line-height:1.7;margin:0\">O histórico da sua criação associado aos resultados da raça. Planejamento genético com base no que sua manada realmente tem — não no que você lembra que tem.<\u002Fp>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Genealogia automática até a 5ª geração via ABCCC<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Rankings de afixos, pais e avós de toda a manada<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Decisão de cruzamento com dados reais em mãos<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Histórico completo de cada animal desde o nascimento<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:16px;padding:2rem;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;animation:fadeUp .6s ease .08s both\" style-hover=\"transform:translateY(-3px);border-color:#3D7A54\">\n      <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#B8860B,#D4A017)\"><\u002Fdiv>\n      <div style=\"font-size:2rem;margin-bottom:1rem\">📱<\u002Fdiv>\n      <h3 style=\"font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:#1C1008;margin:0 0 .6rem\">Controle na palma da mão<\u002Fh3>\n      <p style=\"font-size:13.5px;color:#5C4F42;font-weight:300;line-height:1.7;margin:0\">Informação em tempo real acessível de qualquer dispositivo. O cabanheiro registra no celular em campo. O veterinário acessa do computador. O criador acompanha de onde estiver.<\u002Fp>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Alertas automáticos de vacinas e exames a vencer<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Dashboard com situação completa da cabanha<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Verificação sanitária antes de cada evento ABCCC<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Linha do tempo visual com fotos por animal<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:16px;padding:2rem;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;animation:fadeUp .6s ease .16s both\" style-hover=\"transform:translateY(-3px);border-color:#3D7A54\">\n      <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4A2E18,#8A7F72)\"><\u002Fdiv>\n      <div style=\"font-size:2rem;margin-bottom:1rem\">⚡<\u002Fdiv>\n      <h3 style=\"font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:#1C1008;margin:0 0 .6rem\">Eficiência operacional<\u002Fh3>\n      <p style=\"font-size:13.5px;color:#5C4F42;font-weight:300;line-height:1.7;margin:0\">Menos tempo buscando informação, menos perdas por descuido, menos despesas evitáveis. Controles precisos que eliminam os erros de quem gerencia no improviso.<\u002Fp>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Zero animal vencido entrando em prova<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Custo real por animal — nutrição, saúde e eventos<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Estoque alimentado pelo consumo automaticamente<\u002Fli>\n        <li style=\"font-size:12.5px;color:#8A7F72;display:flex;gap:.5rem;line-height:1.4\"><span style=\"color:#3D7A54;flex-shrink:0;font-size:11px;margin-top:1px\">↗<\u002Fspan>Histórico permanente na nuvem — zero dado perdido<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:linear-gradient(90deg,transparent,#DDD5C8,transparent)\"><\u002Fdiv>\n\n<!-- MÓDULOS -->\n<section style=\"padding:7rem 5%;background:#F5EFE0\" id=\"modulos\">\n<div style=\"max-width:1200px;margin:0 auto\">\n  <div style=\"font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#3D7A54;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem\"><span style=\"display:block;width:14px;height:2px;background:#3D7A54;border-radius:2px\"><\u002Fspan>11 módulos integrados<\u002Fdiv>\n  <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700;line-height:1.12;color:#1C1008;margin:0 0 .8rem\">Um sistema completo.<br>Tudo conectado, tudo em um lugar.<\u002Fh2>\n  <p style=\"font-size:1rem;color:#8A7F72;max-width:560px;font-weight:300;line-height:1.75;margin:0 0 3rem\">O que você registra na saúde aparece na linha do tempo. O consumo da nutrição deduz do estoque. Cada módulo conversa com os outros.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem\">\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:10px;padding:1.4rem 1.6rem;display:flex;gap:1rem;align-items:flex-start;transition:border-color .2s\" style-hover=\"border-color:#3D7A54\"><div style=\"font-size:1.5rem;width:36px;flex-shrink:0;text-align:center;margin-top:2px\">🐎<\u002Fdiv><div><div style=\"font-size:14px;font-weight:600;color:#1C1008;margin-bottom:.25rem\">Cadastro de Animais<\u002Fdiv><div style=\"font-size:12.5px;color:#5C4F42;font-weight:300;line-height:1.55\">Ficha completa preenchida automaticamente pelo SBB via ABCCC. Histórico de situação, estágio, pelagem e genealogia com filtros avançados.<\u002Fdiv><span style=\"display:inline-block;margin-top:.4rem;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:99px;border:1px solid rgba(184,134,11,.2);background:#FBF5DC;color:#B8860B\">ABCCC<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:10px;padding:1.4rem 1.6rem;display:flex;gap:1rem;align-items:flex-start;transition:border-color .2s\" style-hover=\"border-color:#3D7A54\"><div style=\"font-size:1.5rem;width:36px;flex-shrink:0;text-align:center;margin-top:2px\">💉<\u002Fdiv><div><div style=\"font-size:14px;font-weight:600;color:#1C1008;margin-bottom:.25rem\">Saúde — Vacinas, Exames e Vermifugação<\u002Fdiv><div style=\"font-size:12.5px;color:#5C4F42;font-weight:300;line-height:1.55\">Kanban visual por status de vencimento. Protocolos rápidos de Influenza, Tétano e AIE. Alertas com 30 dias de antecedência. Histórico completo por animal.<\u002Fdiv><span style=\"display:inline-block;margin-top:.4rem;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:99px;border:1px solid rgba(61,122,84,.2);background:#EBF5EF;color:#3D7A54\">Alertas automáticos<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DDD5C8;border-radius:10px;padding:1.4rem 1.6rem;display:flex;gap:1rem;align-items:flex-start;transition:border-color .2s\" style-ho
