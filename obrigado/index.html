<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado — Mimba</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--terra:#1C1008;--ouro-x:#E8C547;--campo:#2D5A3D;--campo-l:#3D7A54;--creme:#F5EFE0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--terra);color:var(--creme);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.2rem}
  .check{width:72px;height:72px;border-radius:50%;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:1.5rem;color:#fff}
  h1{font-family:'Playfair Display',serif;font-weight:900;color:var(--ouro-x);font-size:2rem;margin-bottom:.6rem}
  p{color:rgba(245,239,224,.7);font-size:1rem;line-height:1.7;max-width:460px;margin-bottom:.5rem}
  .box{background:rgba(255,255,255,.05);border:1px solid rgba(245,239,224,.12);border-radius:12px;padding:1.2rem 1.4rem;max-width:460px;margin:1.4rem 0;font-size:.9rem;color:rgba(245,239,224,.75)}
  a.btn{display:inline-block;margin-top:.6rem;background:var(--campo);color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600}
  a.btn:hover{background:var(--campo-l)}
  a.link{color:rgba(245,239,224,.5);font-size:13px;text-decoration:none;margin-top:1.5rem}
</style>
</head>
<body>
  <div class="check">✓</div>
  <h1 id="titulo">Pagamento recebido!</h1>
  <p id="texto">Obrigado por contratar o <strong style="color:var(--creme)">Mimba</strong>. Estamos preparando o ambiente da sua cabanha.</p>
  <div class="box" id="box">Em instantes você recebe os <strong style="color:var(--creme)">dados de acesso</strong> no email cadastrado. Depois é só entrar em <strong style="color:var(--creme)">app.mimba.com.br</strong> com seu email e senha.</div>
  <a class="btn" href="https://app.mimba.com.br">Ir para o login →</a>
  <a class="link" href="https://mimba.com.br">← Voltar ao site</a>
<script>
if(new URLSearchParams(location.search).get('trial')==='1'){
  document.getElementById('titulo').textContent='Sua cabanha está pronta!';
  document.getElementById('texto').innerHTML='Seu teste grátis de <strong style="color:var(--creme)">30 dias</strong> do <strong style="color:var(--creme)">Mimba</strong> começou agora. Nenhuma cobrança foi feita.';
  document.getElementById('box').innerHTML='Em instantes você recebe os <strong style="color:var(--creme)">dados de acesso</strong> no email cadastrado. Após os 30 dias, a cobrança do plano escolhido inicia automaticamente no cartão informado — cancele quando quiser antes disso.';
}
</script>
</body>
</html>
